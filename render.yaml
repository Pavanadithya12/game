services:
  - type: web
    name: mawabro-game
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --prefix client && npm install --include=dev --prefix server && npm run build
    startCommand: node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PORT
        value: 10000
